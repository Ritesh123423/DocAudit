services:
  # Backend API (Express + MongoDB/GridFS)
  - type: web
    name: audit-doc-analyzer-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false # paste your Atlas connection string in the Render dashboard
      - key: CLIENT_ORIGIN
        sync: false # paste your client service's URL once it exists, e.g. https://audit-doc-analyzer-client.onrender.com

  # Frontend (React + Vite static build)
  - type: web
    name: audit-doc-analyzer-client
    runtime: static
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false # paste your server service's URL once it exists, e.g. https://audit-doc-analyzer-server.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
